packages:
  - "apps/*"
  - "packages/*"
  - "integrations/*"
  - "tools/*"

# pnpm 11 runs a dependency's lifecycle scripts only when explicitly allowed.
# Approve the tools whose postinstall we trust.
allowBuilds:
  nx: true
  better-sqlite3: true

# Shared external dependency versions. Every workspace package references
# these via the `catalog:` protocol so a version bump lives in exactly one
# place. Add new shared externals here, never inline version ranges.
catalog:
  "@biomejs/biome": "2.5.2"
  "@types/better-sqlite3": "7.6.13"
  "@types/node": "26.1.0"
  "@types/react": "19.2.17"
  "@types/react-dom": "19.2.3"
  better-sqlite3: "12.11.1"
  nx: "23.0.1"
  playwright: "1.61.1"
  react: "19.2.7"
  react-dom: "19.2.7"
  typescript: "6.0.3"
  vitest: "4.1.9"
  zod: "4.4.3"

# pnpm 11 ships a built-in `minimumReleaseAge` supply-chain policy (~1 day).
# Every external above is exact-pinned in the catalog, so the policy only adds
# flakiness (freshly-pinned releases flip-flop across the cutoff by seconds)
# without adding safety -> disabled repo-wide. NOTE: a non-frozen `pnpm install`
# may re-add a `minimumReleaseAgeExclude` block here for any package still inside
# the window (pre-existing pnpm 11 auto-management, see learnings #3); remove it
# or rely on `--frozen-lockfile` (CI), which does not trigger the rewrite.
# Rationale: decisions D6 / D12.
minimumReleaseAge: 0
